<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Transcription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.6.0/dist/livekit-client.umd.js"></script>
    <style>
        .transcription-text {
            direction: rtl;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .new-segment {
            animation: highlight 1s ease-out;
        }
        @keyframes highlight {
            from { background-color: #fef3c7; }
            to { background-color: transparent; }
        }
        .participant {
            transition: all 0.3s ease;
        }
        .participant.speaking {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Multi-Peer Arabic Transcription</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="md:col-span-2 bg-white rounded-lg shadow-md p-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-2 flex-wrap">
                        <input id="roomInput" type="text" placeholder="Room name (optional)"
                               class="border rounded px-3 py-2 text-sm w-40">
                        <input id="nameInput" type="text" placeholder="Your name"
                               class="border rounded px-3 py-2 text-sm w-32">
                        <button id="joinBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition">
                            Join
                        </button>
                        <button id="leaveBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium transition" disabled>
                            Leave
                        </button>
                    </div>
                    <div id="status" class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-gray-400" id="statusDot"></span>
                        <span id="statusText" class="text-sm text-gray-600">Disconnected</span>
                    </div>
                </div>
                <div class="text-xs text-gray-500">
                    Room: <span id="roomName">-</span>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow-md p-4">
                <h3 class="text-sm font-semibold mb-3 text-gray-700">Participants</h3>
                <div id="participants" class="space-y-2 max-h-32 overflow-y-auto">
                    <p class="text-xs text-gray-400">No participants</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700">Transcription</h2>
                <button id="clearBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-3 py-1 rounded text-sm font-medium transition">
                    Clear
                </button>
            </div>
            <div id="transcription" class="transcription-text min-h-64 max-h-96 overflow-y-auto p-4 bg-gray-50 rounded border text-lg leading-relaxed">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
