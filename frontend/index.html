<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arabic Transcription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-peer@9.11.1/simplepeer.min.js"></script>
    <style>
        .transcription-text {
            direction: rtl;
            text-align: right;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .new-segment {
            animation: highlight 1s ease-out;
        }
        @keyframes highlight {
            from { background-color: #fef3c7; }
            to { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Arabic Speech Transcription</h1>

        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <button id="startBtn" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-medium transition">
                        Start
                    </button>
                    <button id="stopBtn" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg font-medium transition" disabled>
                        Stop
                    </button>
                    <button id="clearBtn" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium transition">
                        Clear
                    </button>
                </div>
                <div id="status" class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-gray-400" id="statusDot"></span>
                    <span id="statusText" class="text-sm text-gray-600">Disconnected</span>
                </div>
            </div>
            <div class="text-xs text-gray-500">
                Session: <span id="sessionId">-</span>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Transcription</h2>
            <div id="transcription" class="transcription-text min-h-64 max-h-96 overflow-y-auto p-4 bg-gray-50 rounded border text-lg leading-relaxed">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
